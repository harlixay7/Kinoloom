[pytest]
addopts = -ra --tb=short
testpaths = tests
# tool/ is deliberately NOT on the path: tests/conftest.py imports the studio
# modules from a throwaway sandbox copy so the suite can never touch a live
# studio's databases, job store or ComfyUI instances.
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
